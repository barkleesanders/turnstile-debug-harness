<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloudflare Turnstile Demo</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/app.js"></script>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=renderTurnstileWidget&render=explicit"
      defer
    ></script>
  </head>
  <body>
    <main class="layout">
      <section class="panel">
        <h1>Cloudflare Turnstile Integration</h1>
        <p>
          Complete the form and pass the Turnstile challenge to simulate an account creation guarded by
          Cloudflare's bot mitigation.
        </p>

        <form id="demo-form" autocomplete="off">
          <label>
            Name
            <input type="text" name="name" placeholder="Pat Example" required />
          </label>

          <label>
            Email
            <input type="email" name="email" placeholder="pat@example.com" required />
          </label>

          <div id="turnstile-widget" class="turnstile-widget" aria-live="polite"></div>

          <div class="status" id="status"></div>

          <button type="submit">Submit</button>
        </form>
      </section>
    </main>
  </body>
</html>
